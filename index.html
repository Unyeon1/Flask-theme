    .flask-visual { width: 65px; height: 92px; margin: 2px 0; display: block; }
    .percentage-badge { font-size: 0.95rem; font-weight: 700; color: var(--accent-blue); margin-top: 4px; }
    .controls { display: flex; align-items: center; gap: 3px; width: 100%; justify-content: center; margin-top: 8px; }
    .step-btn { background: #334155; color: #fff; border: none; width: 22px; height: 22px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; cursor: pointer; transition: background 0.2s; }
    .step-btn:hover { background: var(--accent-blue); color: #0f172a; }

    .image-preview-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; padding: 16px; }

    .close-btn { margin-top: 16px; background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
  </style>
</head>
